## The following settings previously lived under the root package.json's
## "pnpm" field. pnpm 11 no longer reads that field -- these all moved here.
packageExtensions:
  ## @glint/ember-tsc augments ember-modifier's types via `import 'ember-modifier'` without
  ## declaring it, so with `hoist: false` the augmentation silently fails to resolve and
  ## function modifiers stop type-checking. Declaring it as an optional peer links it only
  ## where the consuming package already depends on ember-modifier.
  "@glint/ember-tsc":
    peerDependencies:
      ember-modifier: "*"
    peerDependenciesMeta:
      ember-modifier:
        optional: true
  ## Mermaid.vue imports vue but the package declares no dependency on it, so pnpm links
  ## nothing and the production build fails to resolve it.
  vitepress-plugin-mermaid:
    peerDependencies:
      vue: "*"
  vitepress-plugin-group-icons:
    peerDependencies:
      vite: "*"
  typedoc-vitepress-theme:
    peerDependencies:
      typedoc: "*"
  "@glimmer/syntax":
    dependencies:
      "@glimmer/env": ^0.1.7
  ember-page-title:
    peerDependencies:
      "@glimmer/component": "*"
      ember-source: "*"
  ember-source:
    peerDependencies:
      "@glimmer/component": "*"

