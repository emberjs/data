peerDependencyRules:
  ignoreMissing:
    - rsvp
    - "@glimmer/component"
    - search-insights
    - "@pnpm/logger"
    - "@algolia/client-search"
  allowedVersions:
    ## vitepress-plugin-mermaid's published peer range predates VitePress 2. Its code needs
    ## no changes for 2.x (the maintained fork is byte-identical apart from the range), so
    ## accept the version this workspace actually installs.
    "vitepress-plugin-mermaid>vitepress": ">=2.0.0-alpha"

  allowAny:
    - ember-source
    - "@glimmer/component"
    - typescript
    - "@pnpm/logger"

allowUnusedPatches: true

patchedDependencies:
  qunit@2.19.4: patches/qunit@2.19.4.patch
  testem@3.11.0: patches/testem@3.11.0.patch
  "@ember/test-helpers@3.3.0": patches/@ember__test-helpers@3.3.0.patch
  "@ember/test-helpers@4.0.4": patches/@ember__test-helpers@4.0.4.patch
  "@ember/test-helpers@5.1.0": patches/@ember__test-helpers@5.1.0.patch
  "@ember/test-helpers@5.2.0": patches/@ember__test-helpers@5.2.0.patch
  ember-source@4.4.5: patches/ember-source@4.4.5.patch
  ember-source@3.28.12: patches/ember-source@3.28.12.patch
  "@ember/test-helpers@>=5.7.0 <6": patches/@ember__test-helpers@5.7.patch
  ## An entry keeps its file-level doc comment (`@module`) when its first statement is an
  ## import or `export ... from` (sxzz/rolldown-plugin-dts#311, open). @warp-drive/ember's API
  ## docs are built from its dist .d.ts, and lose their layout without that comment's
  ## `@mergeModuleWith <project>`. Keyed to a range so 0.28.x bumps keep it; install fails if
  ## it stops applying. Widen the range for 0.29, and drop it once a release includes the fix.
  "rolldown-plugin-dts@>=0.28.8 <0.29": patches/rolldown-plugin-dts@0.28.patch

## pnpm 11 requires explicit opt-in for dependency postinstall/build scripts.
## unrs-resolver (native resolver used transitively by eslint-import-context)
## is a well-known, widely-used package; its postinstall just fetches the
## prebuilt native binary for the current platform.
allowBuilds:
  unrs-resolver: true
